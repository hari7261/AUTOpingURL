name: Ping URL Twice a Day

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping URL 10,000 times
        run: |
          URL="https://hari7261.github.io/INDUS/index.html"
          mkdir -p logs
          LOG_FILE="logs/requests.log"

          for i in {1..10000}; do
            status_code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') - Request #$i - Status: $status_code" >> "$LOG_FILE"
          done

      - name: Commit and push logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add logs/requests.log

          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi

          git commit -m "Log 10,000 pings at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
