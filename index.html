<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Ping Dashboard</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f8fb;
        color: #1f2937;
      }

      .container {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        margin-bottom: 4px;
      }

      .meta {
        margin-bottom: 16px;
        color: #6b7280;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }

      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 12px;
      }

      .card h3 {
        margin: 0;
        font-size: 13px;
        color: #6b7280;
        font-weight: 600;
      }

      .card p {
        margin: 8px 0 0;
        font-size: 22px;
        font-weight: 700;
      }

      #request-log {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 16px;
        min-height: 200px;
      }

      .log-entry {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        border-bottom: 1px solid #f1f5f9;
        padding: 8px 0;
        font-size: 13px;
      }

      .log-entry:last-child {
        border-bottom: none;
      }

      .ok {
        color: #15803d;
      }

      .bad {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>URL Ping Dashboard</h1>
      <p class="meta">Auto-refreshes every 10 seconds and shows latest request activity.</p>

      <section class="stats">
        <article class="card">
          <h3>Total log lines</h3>
          <p id="total-lines">-</p>
        </article>
        <article class="card">
          <h3>Success (HTTP 200)</h3>
          <p id="ok-count" class="ok">-</p>
        </article>
        <article class="card">
          <h3>Non-200</h3>
          <p id="bad-count" class="bad">-</p>
        </article>
      </section>

      <section id="request-log">
        <p>Loading...</p>
      </section>
    </main>

    <script>
      const LOG_URL = "logs/requests.log";

      async function fetchLogs() {
        const logContainer = document.getElementById("request-log");

        try {
          const response = await fetch(LOG_URL, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Unable to load logs: ${response.status}`);
          }

          const text = await response.text();
          const lines = text
            .split("\n")
            .map((line) => line.trim())
            .filter(Boolean);

          const reversed = [...lines].reverse();
          const recent = reversed.slice(0, 20);

          const okCount = lines.filter((line) => line.includes("Status: 200")).length;
          const badCount = lines.length - okCount;

          document.getElementById("total-lines").textContent = String(lines.length);
          document.getElementById("ok-count").textContent = String(okCount);
          document.getElementById("bad-count").textContent = String(badCount);

          if (recent.length === 0) {
            logContainer.innerHTML = "<p>No requests logged yet.</p>";
            return;
          }

          logContainer.innerHTML = "";
          recent.forEach((line) => {
            const div = document.createElement("div");
            div.className = "log-entry";
            if (line.includes("Status: 200")) {
              div.classList.add("ok");
            } else {
              div.classList.add("bad");
            }
            div.textContent = line;
            logContainer.appendChild(div);
          });
        } catch (error) {
          logContainer.innerHTML = `<p class="bad">Error loading logs: ${error.message}</p>`;
        }
      }

      fetchLogs();
      setInterval(fetchLogs, 10_000);
    </script>
  </body>
</html>
